# Publie automatiquement le site sur GitHub Pages à chaque mise à jour de la branche main.
# Le site construit est poussé sur la branche gh-pages, servie par GitHub Pages.
# Adresse : https://ng-offischield.github.io/smartBoutique/
name: Déploiement GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build
        run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
          VITE_SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
      - name: Préparer pour GitHub Pages
        # 404.html renvoie vers l'application (routes /telephones/...), .nojekyll désactive Jekyll
        run: |
          cp dist/index.html dist/404.html
          touch dist/.nojekyll
      - name: Publier sur la branche gh-pages
        working-directory: dist
        run: |
          git init -q -b gh-pages
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -q -m "Déploiement ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
